    REST API for the Polymer embedded analytics platform. Manage workspaces
    and users, connect and sync data sources (Snowflake, BigQuery, uploads),
    create and update datasets, compose boards from visualization blocks, and
    mint embed tokens to render permission-scoped dashboards inside your own
    application.
