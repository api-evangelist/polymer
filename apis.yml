aid: polymer
name: Polymer
description: >-
  Polymer (Polymer Search) is an AI-driven embedded analytics and business
  intelligence platform that lets teams and product developers turn raw
  spreadsheet, database, and SaaS data into interactive dashboards, charts,
  and visualizations without a data analyst. Its REST API lets developers
  create workspaces, connect data sources (Snowflake, BigQuery, CSV/JSON
  uploads), build boards composed of visualization blocks, and embed
  white-labeled, permission-scoped dashboards directly into their own
  applications with a few lines of code. Authentication is via API key, with
  short-lived embed tokens for end-user access. Polymer is backed by Sierra
  Ventures and 500 Global.
